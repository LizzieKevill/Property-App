<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#143e36">
    <title>UK Property App</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; background: #f3f5ef; color: #143e36; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 640px; padding: clamp(24px, 6vw, 56px); background: white; border-radius: 24px; }
      .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
      h1 { font-size: clamp(32px, 7vw, 52px); line-height: 1.1; margin: 24px 0; }
      p { line-height: 1.65; }
      .status { margin-top: 32px; padding-top: 24px; border-top: 1px solid #dce5df; color: #52665e; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">UK Property App</p>
      <h1>Your next home, a little easier to find.</h1>
      <p>A place to explore UK houses from your phone.</p>
      <p class="status">Coming soon. We’re setting up the project and planning the first features.</p>
    </main>
  </body>
</html>
